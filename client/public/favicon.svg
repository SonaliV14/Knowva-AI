<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#0f0f0f"/>

  <!-- Outer ring -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#f97316" stroke-width="1" opacity="0.3"/>
  <!-- Inner ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#f97316" stroke-width="0.8" opacity="0.5"/>

  <!-- 4 neural nodes on outer ring -->
  <circle cx="16" cy="3"  r="1.8" fill="#f97316"/>
  <circle cx="29" cy="16" r="1.8" fill="#f97316"/>
  <circle cx="16" cy="29" r="1.8" fill="#f97316"/>
  <circle cx="3"  cy="16" r="1.8" fill="#f97316"/>

  <!-- Lines from center to nodes -->
  <line x1="16" y1="16" x2="16" y2="5"  stroke="#f97316" stroke-width="0.8" opacity="0.5"/>
  <line x1="16" y1="16" x2="27" y2="16" stroke="#f97316" stroke-width="0.8" opacity="0.5"/>
  <line x1="16" y1="16" x2="16" y2="27" stroke="#f97316" stroke-width="0.8" opacity="0.5"/>
  <line x1="16" y1="16" x2="5"  cy="16" stroke="#f97316" stroke-width="0.8" opacity="0.5"/>

  <!-- Center filled circle -->
  <circle cx="16" cy="16" r="7" fill="#f97316"/>

  <!-- K letterform -->
  <text x="16" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#0f0f0f">K</text>
</svg>
